[workspace]
members = ["crates/office-core", "crates/office-wasm", "crates/office-docx"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3"
unicode-segmentation = "1.13.3"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false }
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"] }

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
