[workspace]
members = ["crates/office-core", "crates/office-wasm", "crates/office-docx", "crates/office-layout", "crates/office-formats"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
tempfile = "3"
unicode-segmentation = "1.13.3"
zip = { version = "=9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = { version = "=0.42.0", default-features = false }
roxmltree = { version = "=0.21.2", default-features = false, features = ["std"] }
parley = { version = "=0.13.0", default-features = false, features = ["libm"] }
skrifa = { version = "=0.49.0", default-features = false, features = ["libm"] }
libm = "=0.2.16"
sha2 = { version = "=0.11.1", default-features = false }
pdf-writer = "=0.15.0"
svgtypes = { version = "=0.16.2", default-features = false, features = ["libm"] }
rclip-rtf = { version = "=0.1.0", default-features = false }

png = { version = "=0.18.1", default-features = false }
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
kamadak-exif = "=0.6.2"

[workspace.lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
