name: Graphe font asset import (one-time)

on:
  push:
    branches: [chore/graphe-fonts-v4]
    paths:
      - .github/workflows/graphe-font-import.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pinned branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: chore/graphe-fonts-v4
          persist-credentials: true

      - name: Install temporary font metadata inspector
        run: python3 -m pip install --disable-pip-version-check fonttools==4.61.1

      - name: Download and verify upstream OFL font files
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from fontTools.ttLib import TTFont

          ROOT = Path("crates/office-layout/fonts")
          REV = "cc39c4c2c304bc368c9b7c311ea2bcc6013299fe"
          SOURCE = [
              # family, Google Fonts path, filename, style, size, upstream git blob
              ("Lora", "lora", "Lora[wght].ttf", "normal", 212196, "ee1914c3746140523de2940d267ec2215bd85d5b"),
              ("Lora", "lora", "Lora-Italic[wght].ttf", "italic", 221232, "e973ccf7e5c69a831090c729a0dc2c592f42f4cc"),
              ("Montserrat", "montserrat", "Montserrat[wght].ttf", "normal", 744936, "c97aca18592834d8706549c279cb8d5ac5d85f69"),
              ("Montserrat", "montserrat", "Montserrat-Italic[wght].ttf", "italic", 762376, "c8b8441744f2092ea8cbeb7b6f881e53bfe9c623"),
              ("DM Sans", "dmsans", "DMSans[opsz,wght].ttf", "normal", 240164, "c672f98060af9b2c85fca704ebd5ad9a8717c1df"),
              ("DM Sans", "dmsans", "DMSans-Italic[opsz,wght].ttf", "italic", 285040, "bf6819b0f811026ecf98d66183509b7302c0bf61"),
              ("Bitter", "bitter", "Bitter[wght].ttf", "normal", 328636, "7f6d58e633e22ab99597e0c0c17bd21c11630d99"),
              ("Bitter", "bitter", "Bitter-Italic[wght].ttf", "italic", 317652, "39180c778f100c7d378198d7d570b4cea8c1d829"),
          ]
          LICENSES = [
              ("Lora", "lora", 4423, "d0ce7fe062e60eaa92c4af3ee1bebe81c5141b4e"),
              ("Montserrat", "montserrat", 4400, "fe576a2ee1f96353b05d030c0b7620d525cc53a8"),
              ("DM Sans", "dmsans", 4482, "4430b85ac62998e2edb914360f9ebdfe43f4deaa"),
              ("Bitter", "bitter", 4424, "dccc3f4a882cd04852985be1ecc2849eb4338410"),
          ]
          manifest_path = ROOT / "manifest.json"
          manifest = json.loads(manifest_path.read_text())
          assert manifest["catalog_id"] == "writer-fonts-v3", "Unexpected base catalog; review manually"
          existing = {entry["file"] for entry in manifest["entries"]}

          def get(source_path, expected_len, sha):
              url = "https://raw.githubusercontent.com/google/fonts/" + REV + "/" + quote(source_path, safe="/,")
              req = Request(url, headers={"User-Agent":"Graphe-font-catalog-import"})
              with urlopen(req, timeout=45) as response:
                  data = response.read(expected_len + 1)
              assert len(data) == expected_len, (source_path, len(data), expected_len)
              git_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              assert git_blob == sha, (source_path, git_blob, sha)
              return url, data

          def entry_base(local, path, url, data, blob, kind):
              assert local not in existing, local
              existing.add(local)
              return dict(file=local, repository="google/fonts", commit=REV,
                          source_path=path, url=url, git_blob_sha1=blob,
                          byte_length=len(data), kind=kind, sha256=hashlib.sha256(data).hexdigest())

          for family, short, filename, style, size, blob in SOURCE:
              local = filename.split("[")[0].removesuffix("-Italic") + ("-Italic" if style == "italic" else "-Regular") + ".ttf"
              # Strip original .ttf from the prefix before adding local style.
              stem = filename.split("[")[0].removesuffix("-Italic").removesuffix(".ttf")
              local = stem + ("-Italic" if style == "italic" else "-Regular") + ".ttf"
              path = f"ofl/{short}/{filename}"
              url, data = get(path, size, blob)
              face = TTFont(io.BytesIO(data), lazy=False)
              assert "glyf" in face and "fvar" in face, (family, filename)
              axes = [dict(tag=a.axisTag, minimum=a.minValue, maximum=a.maxValue) for a in face["fvar"].axes]
              weight_axis = next((a for a in face["fvar"].axes if a.axisTag == "wght"), None)
              assert weight_axis is not None and weight_axis.minValue <= 400 and weight_axis.maxValue >= 700
              saved = entry_base(local, path, url, data, blob, "font")
              saved.update(family=family, style=style, weight=400,
                           license_file=short.replace("dmsans","DMSans").replace("lora","Lora").replace("montserrat","Montserrat").replace("bitter","Bitter")+".OFL.txt",
                           axes=axes, face_index=0)
              (ROOT / local).write_bytes(data)
              manifest["entries"].append(saved)
              print(f"Verified original font {family} {style}: {local} ({len(data)} bytes)")
          for family, short, size, blob in LICENSES:
              local = family.replace(" ","") + ".OFL.txt"
              path = f"ofl/{short}/OFL.txt"
              url, data = get(path, size, blob)
              assert b"OPEN FONT LICENSE" in data and b"Copyright" in data
              (ROOT / local).write_bytes(data)
              saved = entry_base(local, path, url, data, blob, "license")
              saved["spdx"] = "OFL-1.1"
              manifest["entries"].append(saved)

          manifest["catalog_id"] = "writer-fonts-v4"
          manifest["retrieved_on"] = "2026-11-16"
          manifest["font_bytes"] = sum(e["byte_length"] for e in manifest["entries"] if e["kind"] == "font")
          manifest["derived_files"] = []
          from importlib.util import spec_from_file_location, module_from_spec
          spec = spec_from_file_location("fontverify", ROOT / "verify.py")
          module = module_from_spec(spec)
          spec.loader.exec_module(module)
          notice = module.combined_notice(manifest)
          (ROOT / "NOTICE.txt").write_bytes(notice)
          manifest["derived_files"] = [{"file":"NOTICE.txt","byte_length":len(notice),"sha256":hashlib.sha256(notice).hexdigest(),
              "description":"Complete unmodified upstream notices, combined with source headings."}]
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          checksum_lines = (ROOT / "SHA256SUMS").read_text().splitlines()
          checksum_lines = [x for x in checksum_lines if not x.endswith("  NOTICE.txt") and not x.endswith("  manifest.json")]
          for e in manifest["entries"]:
              if e["file"] in {name for name in ["Lora-Regular.ttf", "Lora-Italic.ttf",
                   "Montserrat-Regular.ttf", "Montserrat-Italic.ttf", "DMSans-Regular.ttf",
                   "DMSans-Italic.ttf", "Bitter-Regular.ttf", "Bitter-Italic.ttf",
                   "Lora.OFL.txt", "Montserrat.OFL.txt", "DMSans.OFL.txt", "Bitter.OFL.txt"]}:
                  checksum_lines.append(f"{e['sha256']}  {e['file']}")
          checksum_lines.append(f"{hashlib.sha256(notice).hexdigest()}  NOTICE.txt")
          checksum_lines.append(f"{hashlib.sha256(manifest_path.read_bytes()).hexdigest()}  manifest.json")
          (ROOT / "SHA256SUMS").write_text("\n".join(checksum_lines) + "\n")
          module.main if False else None
          PY

          python3 crates/office-layout/fonts/verify.py
          (cd crates/office-layout/fonts && sha256sum --check SHA256SUMS)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/office-layout/fonts
          git commit -m "Vendor four pinned OFL font families for Graphe"
          git push origin HEAD:chore/graphe-fonts-v4
