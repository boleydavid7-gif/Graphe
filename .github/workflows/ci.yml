name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install stable Rust with formatting and linting tools
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

      - name: Install Node.js for native layout fingerprint verification
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify native layout matches the shared geometry and outline golden
        run: node apps/writer/tests/layout-check-native.mjs

  writer:
    name: Writer browser integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/writer
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/writer/package-lock.json

      - name: Install stable Rust and WebAssembly target
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

      - name: Check engine, adapters and layout on WebAssembly
        working-directory: .
        run: cargo check --locked --workspace --target wasm32-unknown-unknown

      - name: Install matching WebAssembly bindings CLI
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=moderate

      - name: Build WebAssembly bindings
        run: npm run build:wasm

      - name: Check TypeScript
        run: npm run typecheck

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Test compiled WebAssembly bindings
        run: npm run test:wasm

      - name: Build production frontend
        run: npm run build:cloudflare

      - name: Test hosted toolchain bootstrap and built standalone asset paths
        run: npm run test:build

      - name: Install browser engines for integration tests
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test production frontend and basic browser compatibility
        run: npm run test:browser
